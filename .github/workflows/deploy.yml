name: Bygg og publiser nettsiden

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  # Sendes fra webhooken i Sanity når Karoline publiserer
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Et nytt bygg avbryter et som allerede kjører, så flere publiseringer på rad gir ett bygg
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Hoppes over til variablene er lagt inn under Settings → Secrets and variables → Actions
    if: ${{ vars.PUBLIC_SANITY_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      SITE_URL: ${{ vars.SITE_URL || 'https://fotografkarolinerage.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
