name: Bygg og publiser nettsiden

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  # Sjekker at siden bygger før en pull request slås sammen
  pull_request:
    paths: ['web/**', '.github/workflows/deploy.yml']
  # Sendes fra webhooken i Sanity når Karoline publiserer
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Et nytt bygg avbryter et som allerede kjører, så flere publiseringer på rad gir ett bygg
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || 'ujffh8q9' }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      SITE_URL: ${{ vars.SITE_URL || 'https://fotografkarolinerage.com' }}
      # Utleggingen hoppes over til Cloudflare-nøklene er lagt inn under
      # Settings → Secrets and variables → Actions
      HAR_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Legg ut på Cloudflare
        if: github.event_name != 'pull_request' && env.HAR_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
